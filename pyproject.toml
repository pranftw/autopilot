[project]
name = "autopilot"
version = "0.1.0"
description = "AutoPilot: self-optimizing framework for AI agents with formal train/val/test workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.25.2",
    "pydantic-ai>=1.77.0",
]

[project.scripts]
autopilot = "autopilot.cli.main:main"

[dependency-groups]
dev = [
  "ruff>=0.15.0",
  "ty>=0.0.33",
  "pytest>=8.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3.1",
  "ast-grep-cli>=0.42.1",
  "ast-grep-py>=0.42.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".cursor/", ".claude/", ".agents/"]

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]
exclude = [".cursor/", ".claude/", ".agents/"]


[tool.ruff]
indent-width = 2
line-length = 100
src = ["src", "tests"]
target-version = "py311"
extend-exclude = ["examples", "templates", "src/autopilot/templates"]

[tool.ruff.lint]
preview = true
select = [
  "A", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "D", "DOC", "DTZ",
  "E", "EM", "ERA", "F", "FA", "FBT", "FLY", "FURB", "G", "I",
  "ICN", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PLC", "PLE",
  "PLR", "PLW", "PT", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM",
  "SLF", "T20", "TD", "TID", "TRY", "UP", "W",
]
ignore = [
  "B027",
  "D203", "D213",
  "ARG002", "ERA001", "FBT001", "FBT002",
  "PLR0913", "PLR2004", "PLR6301", "RET504",
  "S101", "TRY003",
  "W191", "E111", "E114", "E117",
  "ISC001", "COM812",
]

[tool.ruff.lint.per-file-ignores]
"src/autopilot/ai/agents/claude_code.py" = ["S404", "S603"]
"src/autopilot/ai/data.py" = ["S311"]
"src/autopilot/data/sampler.py" = ["S311"]
"src/autopilot/data/splitter.py" = ["S311"]
"src/autopilot/cli/command.py" = ["BLE001", "S110"]
"src/autopilot/cli/commands/debug_commands.py" = ["SLF001", "PLC0415"]
"src/autopilot/cli/commands/execute.py" = ["S404", "S603"]
"src/autopilot/cli/commands/track.py" = ["S404", "S603"]
"src/autopilot/cli/output.py" = ["T201"]
"src/autopilot/core/graph.py" = ["N801"]
"src/autopilot/core/module/module.py" = ["PLC2801", "PLR0904"]
"src/autopilot/core/module/module_tree.py" = ["SLF001"]
"src/autopilot/core/module/module_repr.py" = ["SLF001"]
"src/autopilot/core/module/module_runtime.py" = ["SLF001", "PLC2801"]
"src/autopilot/core/module/state.py" = ["SLF001", "PLC2801"]
"src/autopilot/cli/commands/report/narrative.py" = ["DOC201"]
"src/autopilot/core/store/base.py" = ["PLR0904"]
"src/autopilot/core/ops.py" = ["ARG004"]
"src/autopilot/core/parameter.py" = ["PLC2701"]
"src/autopilot/core/gradient.py" = ["PLC2701"]
"src/autopilot/ai/gradient.py" = ["PLC2701"]
"src/autopilot/core/query.py" = ["PLR0904"]
"src/autopilot/core/trainer/trainer.py" = ["PLR0904", "DOC201", "SLF001"]
"src/autopilot/core/trainer/checkpoint.py" = ["SLF001"]
"src/autopilot/core/trainer/eval.py" = ["SLF001", "PT028"]
"src/autopilot/core/trainer/setup.py" = ["SLF001", "ARG001"]
"src/autopilot/core/trainer/journal.py" = ["SLF001"]
"src/autopilot/core/trainer/callbacks_dispatch.py" = ["SLF001"]
"src/autopilot/core/trainer/fit_loop.py" = ["SLF001"]
"src/autopilot/core/trainer/delegates.py" = ["SLF001", "DOC201"]
"src/autopilot/core/callbacks/callback.py" = ["PLR0904"]
"src/autopilot/ai/store/file_store.py" = ["PLR0904", "DOC", "F821"]
"src/autopilot/ai/store/file_store_core.py" = ["PLR0904", "DOC", "F821"]
"src/autopilot/ai/store/file_store_core_peripherals.py" = ["PLR0904", "DOC", "F821"]
"src/autopilot/ai/store/refs.py" = ["DOC501", "SLF001"]
"src/autopilot/ai/store/repair.py" = ["SLF001"]
"src/autopilot/ai/store/snapshot_diff.py" = ["SLF001"]
"src/autopilot/ai/store/snapshot_manifest.py" = ["SLF001"]
"src/autopilot/ai/store/store_reflog.py" = ["SLF001"]
"src/autopilot/ai/store/text_merge.py" = ["SLF001"]
"src/autopilot/ai/store/worktree.py" = ["SLF001"]
"src/autopilot/ai/store/store_io.py" = ["DOC501"]
"src/autopilot/ai/store/file_store_merge_mixin.py" = ["ANN", "DOC"]
"src/autopilot/ai/store/file_store_doctor_mixin.py" = ["ANN", "DOC"]
"src/autopilot/ai/store/snapshot.py" = ["SLF001", "F821", "ARG001", "F401"]
"src/autopilot/ai/store/reset_restore.py" = ["SLF001"]
"src/autopilot/ai/store/snapshot_helpers.py" = ["SLF001"]
"src/autopilot/ai/store/merge.py" = ["SLF001", "F821", "ARG001"]
"src/autopilot/ai/store/doctor.py" = ["SLF001", "F821", "ARG001"]
"src/autopilot/ai/store/peripherals.py" = ["SLF001", "F821", "DOC"]
"tests/**/*.py" = ["ARG", "S", "D", "DOC", "SLF001", "PLR2004", "RUF029", "T20", "DTZ", "TID251", "PLC0415", "PLC2701"]
"examples/**/*.py" = ["D1", "DOC", "T20", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.getenv".msg = "Do not use os.getenv in library code; configure via constructor kwargs"
"os.environ".msg = "Do not use os.environ in library code; configure via constructor kwargs"
"dotenv.load_dotenv".msg = "Do not call load_dotenv in library code"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["autopilot.core.config.Config"]

[tool.ruff.lint.isort]
from-first = true
no-sections = true
lines-between-types = 0
known-first-party = ["autopilot"]

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'lf'
docstring-code-format = true
docstring-code-line-length = 80

[tool.coverage.run]
source = ["src/autopilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = [
  "error",
]
markers = [
  "slow: marks tests as slow (integration / concurrency stress tests)",
]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/autopilot/templates"]

[tool.ty.environment]
python-version = '3.11'
root = ['src']
extra-paths = ['.', 'examples/textmatch', 'examples/protim', 'examples/multi_module']

[tool.ty.rules]
invalid-argument-type = 'error'
invalid-assignment = 'error'
invalid-return-type = 'error'
call-non-callable = 'error'
invalid-method-override = 'error'
unresolved-import = 'error'
unresolved-attribute = 'error'
possibly-unresolved-reference = 'error'
possibly-missing-attribute = 'error'
redundant-cast = 'error'
unused-ignore-comment = 'error'
